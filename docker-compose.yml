services:
  auraui:
    build:
      context: .
      dockerfile: Dockerfile
    image: auraui-vps-monitor:latest
    container_name: auraui-vps-monitor
    restart: unless-stopped
    ports:
      - "0.0.0.0:50505:50505"
    environment:
      NODE_ENV: production
      SERVER_PORT: 50505
      HOST: 0.0.0.0
      TRUST_PROXY: "1"
    env_file:
      - .env.prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:50505/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 20s
