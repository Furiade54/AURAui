services:
  auraui:
    build:
      context: .
      dockerfile: Dockerfile
    image: auraui-vps-monitor:latest
    container_name: auraui-vps-monitor
    restart: unless-stopped
    ports:
      # ---------------------------------------------------------------------
      # AURAI_BIND_ADDRESS  se lee como variable de entorno.
      #   · Si no la defines  →  default 127.0.0.1  (solo loopback, SEGURA,
      #                          solo NPM en el mismo host alcanza el puerto).
      #   · Si la defines     →  AURAI_BIND_ADDRESS=0.0.0.0  para publicar
      #                          en todas las interfaces (acceso IP directo).
      # deploy-auraui.sh se encarga de exportarla por ti.
      # ---------------------------------------------------------------------
      - "${AURAI_BIND_ADDRESS:-127.0.0.1}:50505:50505"
    environment:
      NODE_ENV: production
      SERVER_PORT: 50505
      HOST: 0.0.0.0
      TRUST_PROXY: "1"
    # ---------------------------------------------------------------------
    # env_file:   docker-compose RECHAZA si este archivo NO existe.
    #   · El script deploy-auraui.sh se encarga de crear .env.prod:
    #       a) copiando desde .env.example (si .env.prod no existía), o
    #       b) creando un archivo VACÍO si ni siquiera hay plantilla.
    #   · Así nunca tendremos "Couldn't find env file: .env.prod"
    # ---------------------------------------------------------------------
    env_file:
      - .env.prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:50505/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 20s

# ---------------------------------------------------------------------------
# (OPCIÓN 1 — CONVENCIONAL) Red externa de Nginx Proxy Manager:
#   · Descomenta este bloque, y asegúrate de que el nombre coincida con la
#     red que creó tu nginx-proxy-manager (normalmente npm_default).
#   · O mejor: usa deploy-auraui.sh con AURAI_USE_NPM_NETWORK=1
#     (crea automáticamente docker-compose.override.yml, lo que sobrevive
#      a recreaciones del contenedor mejor que `docker network connect`).
# ---------------------------------------------------------------------------
# networks:
#   default:
#     external: true
#     name: npm_default
